name: Build ShareDrop iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.swift'
      - 'iPhoneStarter.xcodeproj/**'
      - 'iPhoneStarter/Assets.xcassets/**'
      - 'iPhoneStarter/Branding/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare app icon from the 1024x1024 source PNG
        run: |
          set -euo pipefail
          SOURCE_ICON="iPhoneStarter/Branding/ShareDropIcon-1024x1024.png"
          APP_ICON="iPhoneStarter/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          test -f "$SOURCE_ICON"
          test -d "$(dirname "$APP_ICON")"
          WIDTH="$(sips -g pixelWidth "$SOURCE_ICON" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$SOURCE_ICON" | awk '/pixelHeight/ {print $2}')"
          if [[ "$WIDTH" != "1024" || "$HEIGHT" != "1024" ]]; then
            echo "Expected a 1024x1024 PNG at $SOURCE_ICON, got ${WIDTH}x${HEIGHT}."
            exit 1
          fi
          # Use the supplied 1024x1024 artwork directly; no resizing is needed.
          cp "$SOURCE_ICON" "$APP_ICON"
          OUT_WIDTH="$(sips -g pixelWidth "$APP_ICON" | awk '/pixelWidth/ {print $2}')"
          OUT_HEIGHT="$(sips -g pixelHeight "$APP_ICON" | awk '/pixelHeight/ {print $2}')"
          test "$OUT_WIDTH" = "1024"
          test "$OUT_HEIGHT" = "1024"
          echo "Prepared app icon directly from ${WIDTH}x${HEIGHT} source artwork."

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build native SwiftUI app (without Apple signing credentials)
        run: |
          set -euo pipefail
          xcodebuild \
            -project iPhoneStarter.xcodeproj \
            -scheme iPhoneStarter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iPhoneStarter.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/ShareDrop.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/ShareDrop-unsigned.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/ShareDrop-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShareDrop-unsigned-IPA
          path: ShareDrop-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
